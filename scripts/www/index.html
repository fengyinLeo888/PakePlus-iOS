<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 健身助手</title>
<!-- PWA：添加到主屏幕后的主题与图标 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS 主屏幕图标（iOS 不支持 SVG 图标，需 PNG） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 应用外壳：四个页面容器 + 底部 Tab 栏（内容均由 JS 渲染） -->
<div class="app-shell">

  <!-- 今日页：报训练入口 + 今日记录与建议 -->
  <section class="tab-page show" id="page-today"></section>

  <!-- 顾问页：报训练对话入口 + 本地规则免费问答 + AI 对话 -->
  <section class="tab-page" id="page-coach"></section>

  <!-- 记录页：日志 / 体重 / 打卡 / 周报（FR-03） -->
  <section class="tab-page" id="page-log"></section>

  <!-- 我的页：成员 / 动作库 / 备份 / 设置（FR-04） -->
  <section class="tab-page" id="page-me"></section>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button type="button" class="on" data-tab="today"><span class="ico">🏠</span>今日</button>
    <button type="button" data-tab="coach"><span class="ico">💬</span>顾问</button>
    <button type="button" data-tab="log"><span class="ico">📊</span>记录</button>
    <button type="button" data-tab="me"><span class="ico">⚙️</span>我的</button>
  </nav>

</div>

<!-- 数据与逻辑（顺序即依赖顺序，全部原生 JS；defer 保持执行顺序且不阻塞首屏渲染） -->
<script defer src="js/db.js"></script>
<script defer src="js/exercise-data.js"></script>
<script defer src="js/report-parser.js"></script>
<script defer src="js/chart.js"></script>
<script defer src="js/survey.js"></script>
<script defer src="js/ai-client.js"></script>
<script defer src="js/state-cards.js"></script>
<script defer src="js/report.js"></script>
<script defer src="js/today.js"></script>
<script defer src="js/coach.js"></script>
<script defer src="js/meal.js"></script>
<script defer src="js/log.js"></script>
<script defer src="js/me.js"></script>
<script defer src="js/app.js"></script>

<!-- PWA 离线支持：仅 http(s) 下生效，file:// 直开时静默跳过 -->
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* 本地直开或注册失败：不影响功能 */ });
}
</script>

</body>
</html>
